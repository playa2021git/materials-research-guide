<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#fff"/><style>text{font-family:Arial,'Noto Sans JP',sans-serif;fill:#15344a}.h{font-size:33px;font-weight:bold}.b{font-size:23px}.s{font-size:18px}.label{font-size:22px;fill:#12599d;font-weight:bold}</style><text x="36" y="56" class="h">④ AIのツッコミを聞いて考え直した</text><rect x="40" y="98" width="425" height="355" rx="16" fill="#e9f3ff"/><rect x="490" y="98" width="425" height="355" rx="16" fill="#ecf6ed"/><text x="65" y="145" class="label">AIからのツッコミ</text><text x="65" y="200" class="b">アクリルは傷が付きやすい。</text><text x="65" y="250" class="b">合板は燃えやすい。</text><text x="65" y="300" class="b">本当に軽く、安くなる？</text><text x="515" y="145" class="label">自分で考えたこと</text><text x="515" y="205" class="b">納得：学校では防火性能も</text><text x="515" y="240" class="b">重視する必要がある。</text><text x="515" y="309" class="b">まだ検討したい：防火の制約</text><text x="515" y="344" class="b">がない場所なら使えるかも。</text><text x="45" y="500" class="s">AIの言葉を貼るだけでなく、自分の理由を書く</text></svg>