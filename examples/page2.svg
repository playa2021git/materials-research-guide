<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#fff"/><style>text{font-family:Arial,'Noto Sans JP',sans-serif;fill:#15344a}.h{font-size:33px;font-weight:bold}.b{font-size:23px}.s{font-size:18px}.label{font-size:22px;fill:#12599d;font-weight:bold}</style><text x="40" y="58" class="h">② なぜ、この材料を使うのか？</text><g transform="translate(130 170)"><path d="M130 85 L25 -45 M130 85 L245 -45" stroke="#929ca8" stroke-width="25" stroke-linecap="round"/><circle cx="130" cy="85" r="15" fill="#4d6474"/><path d="M130 85L65 200 M130 85L195 200" stroke="#cf4545" stroke-width="27"/><ellipse cx="53" cy="222" rx="43" ry="61" stroke="#d84444" stroke-width="22" fill="none" transform="rotate(25 53 222)"/><ellipse cx="204" cy="222" rx="43" ry="61" stroke="#d84444" stroke-width="22" fill="none" transform="rotate(-25 204 222)"/></g><g fill="#eff6f4"><rect x="430" y="98" width="480" height="118" rx="14"/><rect x="430" y="233" width="480" height="113" rx="14"/></g><text x="455" y="136" class="label">刃が金属なのは？</text><text x="455" y="174" class="b">硬く、薄い刃先でも形を保つため。</text><text x="455" y="270" class="label">持ち手が樹脂なのは？</text><text x="455" y="308" class="b">軽く、握りやすく加工できるため。</text><rect x="35" y="397" width="890" height="113" rx="12" fill="#e8f5ed"/><text x="53" y="431" class="s">社会性：使いやすい ／ 刃でけがをする可能性</text><text x="53" y="465" class="s">経済性：量産しやすい ／ 傷むと交換が必要</text><text x="53" y="499" class="s">環境性：長持ちすればごみ削減 ／ 分別が難しい</text></svg>